[project]
name = "rutina-be"
version = "0.1.0"
description = "FastAPI backend for the Rutina exercise routines organizer"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0,<2.0",
  "asyncpg>=0.30.0,<1.0",
  "fastapi>=0.115.6,<1.0",
  "psycopg2-binary>=2.9.10,<3.0",
  "pydantic>=2.10.4,<3.0",
  "sqlalchemy>=2.0.36,<3.0",
  "uvicorn>=0.34.0,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1,<1.0",
  "pytest>=8.3.5,<9.0",
  "ruff>=0.8.4,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["alembic/versions/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
